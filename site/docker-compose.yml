# blankbook.ru on the Mac mini (192.168.1.76) — one image, three services (BOOK-172).
#
# This file is driven by `site/deploy/compose-release.sh` / `flip.sh`, NOT by a hand-typed
# `docker compose up`: the release script always passes `--env-file /dev/null`, so the host's
# `site/.env` (which carries launchd paths and, in a different shape, plain values) can never leak
# into a service. Every value below is either a container path or an explicit `${BOOK_*}` override;
# secrets are file paths only (invariant 30).
#
#   site       Fastify + the built SPA, published on the Mac's LAN address for Caddy on the
#              home-server (192.168.1.44) — never 0.0.0.0, never loopback (Caddy is another host).
#   engine     the internal writing API; no published port, reachable only on the compose network
#              with a bearer token read from the data dir.
#   writer     the writing lane (`--loop`); no port, no healthcheck (see below).
#
# State: the data dir is a NAMED VOLUME (`book-data`), mounted at /data in all three services. It is
# deliberately NOT a host bind mount (BOOK-183): SQLite in WAL mode shares its `-shm` through the OS,
# and a macOS bind mount into the OrbStack VM is two kernels — the page cache of one is not the other,
# and a host `sqlite3` write while `site` held the same file produced `SQLITE_IOERR_SHORT_READ`
# (2026-10-28). Inside the VM the volume is one kernel and one filesystem (`btrfs` on /dev/vdb1).
# Measured on this box (bookworm-slim + better-sqlite3 as uid 501): WAL set, 300 inserts 4 ms,
# `wal_checkpoint(TRUNCATE)` busy=0, two concurrent writer containers × 400 rows → 800 rows,
# `integrity_check ok`, and the same under `--read-only --tmpfs /tmp`.
#
# So every stateful operation runs INSIDE the container: `deploy/backup.sh` (compose runtime) calls
# `bin/backup.mjs` through `docker compose exec site`, admin/restore/feedback go through
# `deploy/admin.sh`, and the DB is never opened by a host process. `deploy/entrypoint.sh` refuses to
# start a role when /data is a host bind mount (exit 78).
#
# **No service mounts a book tree at all** (BOOK-187, ADR-043 G1/G3). The canon (prompts, concept,
# style, the plan) is baked into the image at its root, and the text is rows in the volume: an
# image that read the HOST's prompts would write a `prompt_bundle` sha naming rules the pass never
# read, and a writable `manuscript/` path would be a second home for prose the DB owns. The only
# host binds are operational: `/backups` (rw, the backup destination) and `/locks` (the
# single-instance lock files, deliberately outside the data dir).
name: book

x-book: &book
  image: ${BOOK_IMAGE_TAG:-book:dev}
  restart: unless-stopped
  # Every file in the data volume is written by uid 501 (filipp) — the migration seeds the volume with
  # `chown -R 501:20` — so the service and the launchd fallback (after a flip-back export) read the
  # same 0600 files, and nothing is ever created as root.
  user: "501:20"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # The root filesystem is read-only; node's HOME and any scratch need a writable /tmp.
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  site:
    <<: *book
    build:
      context: .
      dockerfile: Dockerfile
      # BOOK-187 / ADR-043 G3: the canon (prompts, concept, style) lives one level above `site/`,
      # and the image is its only home at runtime. A named additional context carries those files
      # into the build (the Dockerfile copies them to the image's root, where the writer and
      # `scripts/build-info.mjs` look for them); without it no image can be built at all — the
      # bundle digest refuses to be a bundle of nothing.
      additional_contexts:
        canon: ..
      args:
        # BOOK-109/BOOK-172: the commit the image reports on `/healthz`. Passed by
        # compose-release.sh as `<sha7>`; unset is honest (`dev`) and never happens in a release.
        BOOK_BUILD_COMMIT: ${BOOK_BUILD_COMMIT:-}
    command: ["node", "server/dist/index.js"]
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    stop_grace_period: 20s
    ports:
      # Caddy runs on 192.168.1.44 and cannot reach this host's loopback; the site is never
      # published on 0.0.0.0 and never reachable from the internet directly.
      - "${BOOK_SITE_PUBLISH:-192.168.1.76:8091}:8080"
    volumes:
      # BOOK-183: the store is the named volume, never a host path (see the header).
      - book-data:/data
      # The ONLY host bind for state, and only for backups: `bin/backup.mjs` writes here and the
      # owner reads the copies from the host. Nothing else may open a database through it.
      - ${BOOK_BACKUPS_DIR:-/Users/filipp/book-site-backups}:/backups
      # The single-instance lock files: deliberately OUTSIDE the data dir, so the BOOK-107 isolation
      # guard, the backup snapshots and the launchd fallback never see a file that changes.
      - ${BOOK_LOCKS_DIR:-/Users/filipp/.local/state/book-locks}:/locks
      # Secrets: per-file, 0600 on the host, mode preserved (compose `secrets:` would mount 0444).
      # BOOK-205: the sign-in pair is mounted here too. Compose cannot make a mount conditional, so on
      # a host without those two files Docker mounts an empty directory and `configSecrets.ts` reads it
      # as "sign-in off" — one boot warning per missing file, 503 on `/auth/yandex/start`, the book
      # still serving. The secrets DIRECTORY is never mounted: that would hand this process the
      # writer's model key too.
      - ${BOOK_SECRETS_DIR:-./secrets}/session_secret:/run/secrets/session_secret:ro
      - ${BOOK_SECRETS_DIR:-./secrets}/ip_salt:/run/secrets/ip_salt:ro
      - ${BOOK_SECRETS_DIR:-./secrets}/yandex_client_id:/run/secrets/yandex_client_id:ro
      - ${BOOK_SECRETS_DIR:-./secrets}/yandex_client_secret:/run/secrets/yandex_client_secret:ro
    environment:
      BOOK_ROLE: site
      NODE_ENV: production
      # No BOOK_ROOT on purpose (BOOK-187): the default is the image's own root (`/`), which is
      # where the canon is baked — never a host path, which would be a different canon.
      DATA_DIR: /data
      EXCHANGE_DIR: /data/exchange
      ADMIN_TOKEN_FILE: /data/admin.token
      # No FEEDBACK_DIR on purpose: the triage inbox is derived from EXCHANGE_DIR
      # (`<data>/exchange/feedback`), the same place the launchd jobs and `bin/feedback.mjs` on the
      # host already read and write. Pinning it to `/data/feedback` would move the inbox out from
      # under that CLI.
      WEB_DIST: /app/web/dist
      IMPRINT_PATH: /app/config/imprint.json
      PORT: "8080"
      HOST: 0.0.0.0
      # The canonical origin moved to the product name on 2026-10-30 (BOOK-234): it fixes the
      # mutation/WS origin guard, the session cookie, the CSP `connect-src`, the OAuth
      # `redirect_uri` and every absolute link the page emits. `book.semirov.dev` is now a Caddy
      # 308 to this name, so there is still exactly one origin to accept (origin.ts).
      PUBLIC_ORIGIN: ${BOOK_PUBLIC_ORIGIN:-https://blankbook.ru}
      # A proxy is a host, not a subnet (audit m1). OrbStack *may* rewrite the peer address of a LAN
      # client (then every reader looks like the bridge gateway and the per-IP caps collapse); that
      # can only be measured from a second LAN host AFTER the flip — the check and the one-line fix
      # (this variable gains `192.168.215.1/32`, never a /24) are in BOOK-DOC-67 § 7.
      TRUSTED_PROXIES: ${BOOK_TRUSTED_PROXIES:-127.0.0.1/32,::1/128,192.168.1.44/32}
      WATCH_POLL_MS: "700"
      # BOOK-126: the gift link is PUBLIC — printed on the page, so a plain value is correct here.
      DONATE_URL: ${BOOK_DONATE_URL:-https://t.tb.ru/pm_short/11T50nT6AL}
      METRIKA_ID: ${BOOK_METRIKA_ID:-113820311}
      LOG_LEVEL: ${BOOK_LOG_LEVEL:-info}
      BOOK_TZ: ${BOOK_TZ:-Europe/Moscow}
      # Secrets: PATHS only. `/run/secrets/…` is the mount above; the value never enters the env,
      # `docker inspect` or /proc/1/environ.
      SESSION_SECRET_FILE: /run/secrets/session_secret
      IP_SALT_FILE: /run/secrets/ip_salt
      # BOOK-64: no challenge runs, so no captcha secret is mounted.
      CAPTCHA_SECRET_FILE: ""
      # Sign-in is optional (ADR-021): the two files are always mounted above and these always name
      # the mounts, so the pair is "on" exactly when the host carries both files. A missing one is an
      # empty directory, which the boot reports as "sign-in is off" — one warning per missing file,
      # and a 503 for the pair — while the book keeps serving. An explicit `${BOOK_*}` still wins
      # where a rehearsal needs different paths.
      YANDEX_CLIENT_ID_FILE: ${BOOK_YANDEX_CLIENT_ID_FILE:-/run/secrets/yandex_client_id}
      YANDEX_CLIENT_SECRET_FILE: ${BOOK_YANDEX_CLIENT_SECRET_FILE:-/run/secrets/yandex_client_secret}
    healthcheck:
      # `ok:true` AND the commit this image carries (read from /app/build-info.json inside the
      # image, not from a runtime env value).
      test: ["CMD", "node", "/app/deploy/healthcheck.mjs", "site"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  engine:
    <<: *book
    command: ["node", "server/dist/engine.js"]
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    stop_grace_period: 60s
    # No `ports:` on purpose: the internal API is never proxied and never reachable from the LAN.
    volumes:
      - book-data:/data
      - ${BOOK_LOCKS_DIR:-/Users/filipp/.local/state/book-locks}:/locks
      # BOOK-172: the engine boots through `loadConfig()`, which in production refuses to start
      # without a session secret and an IP salt. Same two 0600 files as the site.
      - ${BOOK_SECRETS_DIR:-./secrets}/session_secret:/run/secrets/session_secret:ro
      - ${BOOK_SECRETS_DIR:-./secrets}/ip_salt:/run/secrets/ip_salt:ro
    environment:
      BOOK_ROLE: engine
      NODE_ENV: production
      DATA_DIR: /data
      ENGINE_TOKEN_FILE: /data/engine.token
      HOST: 0.0.0.0
      PORT: "8081"
      # The owner's writing switch: `off` hands out no writer assignment.
      DRAFTING: ${BOOK_DRAFTING:-on}
      # BOOK-206: the claim's money guard reads the same caps the writer does. Without these two
      # the engine would read the code's defaults while the writer read the host's, and a paused
      # day would still hand out triage (ADR-045 risk 5).
      BOOK_BUDGET_DAY_USD: ${BOOK_BUDGET_DAY_USD:-10}
      BOOK_BUDGET_BOOK_USD: ${BOOK_BUDGET_BOOK_USD:-1000}
      PUBLIC_ORIGIN: ${BOOK_PUBLIC_ORIGIN:-https://blankbook.ru}
      LOG_LEVEL: ${BOOK_LOG_LEVEL:-info}
      BOOK_TZ: ${BOOK_TZ:-Europe/Moscow}
      SESSION_SECRET_FILE: /run/secrets/session_secret
      IP_SALT_FILE: /run/secrets/ip_salt
      CAPTCHA_SECRET_FILE: ""
    healthcheck:
      # The token-guarded endpoint, read with the same 0600 file the engine itself reads.
      test: ["CMD", "node", "/app/deploy/healthcheck.mjs", "engine"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  writer:
    <<: *book
    command: ["node", "server/dist/writer/main.js", "--loop"]
    # The writer's first act at boot is a request to the engine; on a cold start all three containers
    # come up together, the engine is still binding, and the lane recorded `ENGINE_UNREACHABLE` and
    # then slept WRITER_PAUSE_MS (15 min) — a real 15-minute hole measured on this box. Waiting for the
    # engine's own healthcheck closes it. `site` deliberately has no such dependency: it tolerates an
    # absent engine (it reports `engine.status: down` and serves the book anyway), so coupling its
    # start to the engine would only make a site outage out of an engine restart.
    depends_on:
      engine:
        condition: service_healthy
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    # The lane's own rotation: a pass logs every stage for up to 45 minutes, so it keeps more history
    # than the two request-serving services (10 MiB x 3). Still `docker compose logs writer | grep`.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      # No book tree and no manuscript path: the writer's text is a request body, and the canon it
      # reads is the one baked into this image (BOOK-187 — the image is the prompts' only home).
      - book-data:/data
      - ${BOOK_LOCKS_DIR:-/Users/filipp/.local/state/book-locks}:/locks
      - ${BOOK_DEEPSEEK_KEY_FILE:-/Users/filipp/.config/book/deepseek.key}:/run/secrets/deepseek_key:ro
    environment:
      BOOK_ROLE: writer
      NODE_ENV: production
      DATA_DIR: /data
      ENGINE_TOKEN_FILE: /data/engine.token
      WRITER_ENGINE_URL: http://engine:8081
      WRITER_SESSION: writer
      # Must restate `config/pipeline.json` (ADR-038); a different value is refused as
      # MODEL_NOT_PIPELINE rather than silently pricing a model the pin does not know.
      WRITER_MODEL: deepseek/deepseek-v4-pro
      PIPELINE_PATH: /app/config/pipeline.json
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_key
      WRITER_DAILY_TOKENS: ${BOOK_WRITER_DAILY_TOKENS:-1500000}
      WRITER_MAX_TOKENS_PER_CALL: ${BOOK_WRITER_MAX_TOKENS_PER_CALL:-32000}
      BOOK_BUDGET_DAY_USD: ${BOOK_BUDGET_DAY_USD:-10}
      BOOK_BUDGET_BOOK_USD: ${BOOK_BUDGET_BOOK_USD:-1000}
      WRITER_MAX_PASSES_PER_DAY: ${BOOK_WRITER_MAX_PASSES_PER_DAY:-4}
      WRITER_PAUSE_MS: ${BOOK_WRITER_PAUSE_MS:-900000}
      # The owner's mode switch (BOOK-173 §4): `patch` is the signed-off default, `rewrite` forces
      # the whole-chapter path for every ordinary pass until the line is removed.
      WRITER_MODE_DEFAULT: ${BOOK_WRITER_MODE_DEFAULT:-patch}
    # No healthcheck: the writer holds no port, and an idle lane is healthy while writing nothing
    # for WRITER_PAUSE_MS (15 min) — an mtime probe would mark it unhealthy and `up -d` would then
    # recreate a healthy process. Its liveness is the container state plus the engine's lease
    # (LEASE_TTL_MS 120 s) and step wall (STEP_WALL_MS 45 min); see the runbook in BOOK-172.

volumes:
  # BOOK-183: one named volume, a stable name across projects (a rehearsal passes
  # BOOK_DATA_VOLUME=book-183-data), created and seeded ONCE by `deploy/migrate-to-volume.sh`.
  # Inside the VM it is `btrfs` on /dev/vdb1 — one kernel, one page cache. OrbStack also mirrors it on
  # the host at `~/OrbStack/docker/volumes/<name>/`, which is writable (measured: touch/rm, and a new
  # database can be created there) yet must never be opened: a normal second open of the live WAL
  # database fails "unable to open database file (14)", `?immutable=1` only reads a snapshot, and a
  # byte-level write is still possible. The guard cannot stop a deliberate host write, only the bind.
  book-data:
    name: ${BOOK_DATA_VOLUME:-book-data}
