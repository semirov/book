name: Deploy

# Prod is the Mac mini that runs this repository's launchd jobs. The job reaches it through that
# machine's own self-hosted runner (label `mac-mini`): no inbound SSH, no private key stored,
# and the job needs no repository secret — the deploy clone is fetched over https from a public
# repository, and `site/.env` never leaves the machine.
#
# The runner is not offered to pull requests. A deploy can only be started by a person with
# write access (workflow_dispatch) or by pushing a tag, so unreviewed fork code never runs on the
# machine that serves the book. `actions/checkout` is deliberately absent: it would `git clean`
# the workspace, and the one file that must survive — the gitignored `site/.env` — would go.
#
# site/deploy/deploy.sh does the rest: gate (typecheck, arch, tests, coverage floor, build,
# manuscript), refuse if prod is not running this checkout, `launchctl kickstart -k`, wait for
# /healthz 200, and roll back to the previous commit if the service does not come up. A running
# site that answers /healthz but does not serve the frozen frame also fails and rolls back.
# One deploy per deploy root: the script takes `$STATE_DIR/deploy.lock` before it checks anything
# out, and an exit 3 (another deploy is running, so nothing was checked out, built, published or
# restarted) is a notice here — not a red product deploy. Runbook: Lific BOOK-74.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy a ref, or roll back to the last known good commit
        type: choice
        options: [deploy, rollback]
        default: deploy
      ref:
        description: Branch, tag or sha to deploy (ignored by rollback)
        default: main
        required: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: [self-hosted, macOS, mac-mini]
    timeout-minutes: 45
    env:
      # The runner starts from launchd's minimal environment; node comes from Homebrew.
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Deploy
        shell: bash
        env:
          TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'deploy' }}
        run: |
          set -euo pipefail
          root="${BOOK_DEPLOY_ROOT:-$HOME/book-deploy}"
          if [ ! -d "$root/.git" ]; then
            git clone --quiet "https://github.com/${GITHUB_REPOSITORY}.git" "$root"
          fi
          echo "deploy root: $root at $(git -C "$root" rev-parse --short HEAD)"

          # The script that runs is the one that ships with the code being deployed, but it is read
          # out with `git show` into a temp dir — the checkout of the tree is the deploy's own job,
          # under its lock (BOOK-119 hotfix). Checking the tree out here raced a second run over the
          # same clone and half-flipped it.
          dir="$(mktemp -d)"
          cleanup() { rm -rf "$dir"; }
          trap cleanup EXIT

          git -C "$root" fetch --quiet --prune --tags origin
          if [ "$ACTION" = "rollback" ]; then
            # A rollback runs the script already in the tree: its target is the tree's own
            # `last-good`, not a ref an operator typed.
            sha="$(git -C "$root" rev-parse --verify HEAD)"
          else
            sha="$(git -C "$root" rev-parse --verify --quiet "origin/${TARGET_REF}^{commit}" || true)"
            if [ -z "$sha" ]; then sha="$(git -C "$root" rev-parse --verify --quiet "refs/tags/${TARGET_REF}^{commit}" || true)"; fi
            if [ -z "$sha" ]; then sha="$(git -C "$root" rev-parse --verify --quiet "${TARGET_REF}^{commit}" || true)"; fi
            if [ -z "$sha" ]; then
              echo "::error::cannot resolve '$TARGET_REF' in $root"
              exit 2
            fi
          fi
          if ! git -C "$root" show "${sha}:site/deploy/deploy.sh" > "$dir/deploy.sh" 2>/dev/null; then
            echo "::error::no site/deploy/deploy.sh at ${sha:0:7} — deploy the branch that adds it"
            exit 2
          fi
          # The library it sources ships beside it; a ref that predates the split has none.
          git -C "$root" show "${sha}:site/deploy/lib.sh" > "$dir/lib.sh" 2>/dev/null || rm -f "$dir/lib.sh"
          # BOOK-172: the container runtime's driver, when the deployed ref has one. The runtime is a
          # file the flip writes (`$STATE_DIR/runtime`), not a workflow input: a flip changes prod
          # without a workflow edit, and a failed flip leaves it on `launchd`.
          git -C "$root" show "${sha}:site/deploy/compose-release.sh" > "$dir/compose-release.sh" 2>/dev/null || rm -f "$dir/compose-release.sh"
          state="${BOOK_STATE_DIR:-$HOME/.local/state/book-deploy}"
          runtime="$(cat "$state/runtime" 2>/dev/null || echo launchd)"
          driver="$dir/deploy.sh"
          if [ "$runtime" = "compose" ]; then
            driver="$dir/compose-release.sh"
            if [ ! -s "$driver" ]; then
              echo "::error::$state/runtime says compose, but ${sha:0:7} has no site/deploy/compose-release.sh — deploy a ref that does, or flip back to launchd"
              exit 2
            fi
          fi
          echo "runtime: $runtime (driver: $(basename "$driver"))"

          # No `exec`: exit 3 is a refusal, not a product failure. It means another deploy holds the
          # lock — nothing was checked out, built, published or restarted — so this run is green
          # with a notice, and the holder's own result stays the one that speaks about prod.
          set +e
          if [ "$ACTION" = "rollback" ]; then
            /bin/bash "$driver" --rollback --root "$root"
          else
            /bin/bash "$driver" --ref "$TARGET_REF" --root "$root"
          fi
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::notice::another deploy is already running on $root (deploy.sh exit 3): nothing was checked out, built, published or restarted — this workflow run is not a red product deploy"
            exit 0
          fi
          exit "$code"
